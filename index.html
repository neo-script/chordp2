<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chord tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --accent: #4ADE80;
        --accent-dark: #16A34A;
        --accent2: #60A5FA;
        --danger: #EF4444;
        --glass-bg: rgba(20, 25, 38, 0.72);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-hover: rgba(255, 255, 255, 0.1);
        --text: #E8ECF3;
        --text-dim: #9AA4B8;
      }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: linear-gradient(160deg, #081018, #101827);
      }
      #stage { position: relative; width: 100vw; height: 100vh; }

      video {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1);
        filter: brightness(0.45) contrast(1.05) blur(1px) saturate(0.5);
      }
      #tint {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: linear-gradient(160deg, rgba(8,16,24,0.55), rgba(16,24,39,0.75));
      }
      #glow1 {
        position: absolute; width: 600px; height: 600px; left: -150px; top: -150px;
        background: radial-gradient(circle, rgba(96,165,250,0.22), transparent 70%);
        filter: blur(50px); z-index: 1; pointer-events: none;
      }
      #glow2 {
        position: absolute; width: 600px; height: 600px; right: -150px; bottom: -150px;
        background: radial-gradient(circle, rgba(74,222,128,0.15), transparent 70%);
        filter: blur(50px); z-index: 1; pointer-events: none;
      }
      #noise {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        opacity: 0.05; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
      #dimOverlay {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background: rgba(4,7,12,0.6); opacity: 0;
        transition: opacity 0.25s ease;
      }
      #dimOverlay.active { opacity: 1; }

      #keyboardsLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }

      .pad {
        position: absolute; width: 58px; height: 58px; border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.35);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 14px;
        color: #12161f; transform: translate(-50%, -50%); cursor: pointer;
        user-select: none;
        transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease, opacity 0.2s ease;
        z-index: 5;
      }
      .pad:hover { transform: translate(-50%, -50%) scale(1.07); }
      .pad.selected { border-color: var(--accent); border-width: 2px; }

      @keyframes padPulse {
        0% { transform: translate(-50%, -50%) scale(1); }
        30% { transform: translate(-50%, -50%) scale(1.16); }
        55% { transform: translate(-50%, -50%) scale(0.95); }
        100% { transform: translate(-50%, -50%) scale(1.04); }
      }
      .pad.playing { animation: padPulse 0.35s ease-out forwards; }

      .ringGuide {
        position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
        border: 1.5px solid rgba(255,255,255,0.14);
        box-shadow: 0 0 18px rgba(255,255,255,0.04);
        pointer-events: none; box-sizing: border-box; z-index: 2;
      }

      .kbBox {
        position: absolute; transform: translate(-50%, -50%);
        border-radius: 20px; border: none; background: transparent;
        z-index: 1; box-sizing: border-box;
      }
      @keyframes selectPulse {
        0%, 100% { box-shadow: 0 0 30px rgba(96,165,250,0.12); }
        50% { box-shadow: 0 0 46px rgba(96,165,250,0.22); }
      }
      .kbBox.selected {
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
        animation: selectPulse 2.4s ease-in-out infinite;
      }

      .handle {
        position: absolute; width: 14px; height: 14px; border-radius: 50%;
        background: #fff; border: 2px solid var(--accent2);
        box-shadow: 0 0 8px rgba(255,255,255,0.5);
        transform: translate(-50%, -50%); cursor: pointer; z-index: 6;
      }

      .boxActionBtn {
        position: absolute; transform: translate(-50%, -100%);
        font-family: system-ui, sans-serif; font-size: 12px; padding: 6px 14px;
        border-radius: 999px; cursor: pointer; z-index: 6; white-space: nowrap;
        border: 1px solid var(--glass-border); backdrop-filter: blur(6px);
        transition: background 0.15s ease;
      }
      .boxActionBtn.editBtn { background: rgba(96,165,250,0.18); color: #cfe3ff; }
      .boxActionBtn.editBtn:hover { background: rgba(96,165,250,0.3); }
      .boxActionBtn.deleteBtn { background: rgba(239,68,68,0.15); color: #fca5a5; }
      .boxActionBtn.deleteBtn:hover { background: rgba(239,68,68,0.28); }

      #plusBtn {
        position: absolute; right: 24px; bottom: 24px; width: 58px; height: 58px;
        border-radius: 50%; color: #06240f; border: none; font-size: 28px; line-height: 1;
        cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 32% 28%, #86efac, var(--accent) 55%, var(--accent-dark) 100%);
        box-shadow: 0 0 22px rgba(74,222,128,0.45), 0 6px 18px rgba(0,0,0,0.5);
        transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
      }
      #plusBtn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 30px rgba(74,222,128,0.6), 0 10px 22px rgba(0,0,0,0.55); }
      @keyframes fabPop {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(0.85) rotate(90deg); }
        100% { transform: scale(1) rotate(180deg); }
      }
      #plusBtn.popping { animation: fabPop 0.3s ease; }

      #libraryPanel {
        position: absolute; top: 0; right: 0; bottom: 0; width: 280px;
        background: var(--glass-bg); backdrop-filter: blur(16px);
        color: var(--text); padding: 28px 24px; box-sizing: border-box;
        font-family: system-ui, sans-serif; overflow-y: auto; z-index: 20;
        border-left: 1px solid var(--glass-border);
        transform: translateX(24px); opacity: 0; filter: blur(4px);
        pointer-events: none;
        transition: transform 0.25s ease, opacity 0.25s ease, filter 0.25s ease;
      }
      #libraryPanel.open { transform: translateX(0); opacity: 1; filter: blur(0); pointer-events: auto; }
      #libraryPanel h3 { font-size: 24px; margin: 0 0 20px; font-weight: 600; }

      .sectionLabel {
        font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase;
        letter-spacing: 0.08em; margin: 22px 0 10px; padding-top: 14px;
        border-top: 1px solid var(--glass-border);
      }
      .sectionLabel:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }

      #libraryGrid { margin-bottom: 4px; }
      .rootRow {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 8px; border-radius: 8px;
      }
      .rootRow.current { background: rgba(74,222,128,0.1); }
      .rootLabel { font-size: 14px; font-weight: 600; }
      .rootArrow {
        background: none; border: none; color: var(--text-dim); font-size: 13px;
        cursor: pointer; padding: 4px 8px;
      }
      .rootArrow:hover { color: var(--text); }
      .qualityRow { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 8px 14px; }
      .qualityRow button {
        font-size: 11px; padding: 7px 11px; border-radius: 999px;
        border: 1px solid var(--glass-border); background: var(--glass-hover);
        color: var(--text); cursor: pointer; transition: background 0.15s ease;
      }
      .qualityRow button:hover { background: rgba(255,255,255,0.16); }
      .qualityRow button.assigned {
        border-color: var(--accent); background: rgba(74,222,128,0.18);
        box-shadow: 0 0 10px rgba(74,222,128,0.25);
      }

      .btn {
        width: 100%; padding: 11px 0; font-size: 13px; font-weight: 600;
        border-radius: 13px; cursor: pointer; margin-bottom: 8px;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        border: none;
      }
      .btn:active { transform: scale(0.98); }
      .btn-secondary {
        background: var(--glass-hover); color: var(--text); border: 1px solid var(--glass-border);
      }
      .btn-secondary:hover { background: rgba(255,255,255,0.16); }
      .btn-danger {
        background: rgba(239,68,68,0.14); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3);
      }
      .btn-danger:hover { background: rgba(239,68,68,0.24); }
      .btn-danger:disabled { opacity: 0.35; cursor: not-allowed; }
      .btn-primary {
        background: linear-gradient(160deg, var(--accent), var(--accent-dark));
        color: #06240f; box-shadow: 0 4px 14px rgba(74,222,128,0.3);
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(74,222,128,0.4); }

      #advancedSettings summary { font-size: 13px; cursor: pointer; color: var(--text-dim); list-style: none; }
      #advancedSettings label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; }
      .settingLabelRow { display: flex; justify-content: space-between; align-items: baseline; }
      #opacityValue {
        font-family: monospace; color: var(--text); width: 44px; text-align: right;
        background: var(--glass-hover); border: 1px solid var(--glass-border); border-radius: 6px;
        padding: 3px 5px; font-size: 12px;
      }
      #colorInput { width: 100%; height: 34px; border: none; background: none; cursor: pointer; }
      #hexReadout { font-size: 11px; color: var(--text-dim); margin: 6px 0 0; font-family: monospace; }
      #opacityInput { width: 100%; }

      #doneBtn { margin-top: 24px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="tint"></div>
      <div id="glow1"></div>
      <div id="glow2"></div>
      <div id="noise"></div>
      <div id="dimOverlay"></div>
      <div id="keyboardsLayer"></div>
      <button id="plusBtn" aria-label="Add keyboard">+</button>
      <div id="libraryPanel">
        <h3>Chord library</h3>
        <div class="sectionLabel">Roots</div>
        <div id="libraryGrid"></div>
        <div class="sectionLabel">Manage</div>
        <button id="newChordBtn" class="btn btn-secondary">+ New chord</button>
        <button id="deleteChordBtn" class="btn btn-danger">Delete chord</button>
        <div class="sectionLabel">Appearance</div>
        <details id="advancedSettings">
          <summary>Color and transparency</summary>
          <label for="colorInput">Color</label>
          <input type="color" id="colorInput" />
          <p id="hexReadout"></p>
          <label for="opacityInput" class="settingLabelRow">
            <span>Transparency</span>
            <span>
              <input type="number" id="opacityValue" min="0" max="100" />%
            </span>
          </label>
          <input type="range" id="opacityInput" min="0" max="100" />
        </details>
        <button id="doneBtn" class="btn btn-primary">Done</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
