<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chord tool</title>
    <style>
      html, body { margin: 0; background: #0d0d0f; height: 100%; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      video {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1);
      }
      #keyboardsLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

      .pad {
        position: absolute; width: 56px; height: 56px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.5);
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px;
        color: #111; transform: translate(-50%, -50%); cursor: pointer;
        user-select: none; box-shadow: 0 2px 8px rgba(0,0,0,0.45);
        transition: transform 0.12s ease;
        z-index: 5;
      }
      .pad:hover { transform: translate(-50%, -50%) scale(1.06); }
      .pad.selected { border-color: #EF9F27; border-width: 3px; }
      .pad.playing { filter: brightness(1.2); }

      .kbBox {
        position: absolute; transform: translate(-50%, -50%);
        border-radius: 20px; border: 1px dashed transparent;
        z-index: 1; box-sizing: border-box;
      }
      .kbBox.selected { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.03); }

      .handle {
        position: absolute; width: 14px; height: 14px; border-radius: 50%;
        background: #EF9F27; border: 2px solid #fff; transform: translate(-50%, -50%);
        cursor: pointer; z-index: 6;
      }

      .boxActionBtn {
        position: absolute; transform: translate(-50%, -100%);
        font-family: system-ui, sans-serif; font-size: 12px; padding: 6px 14px;
        border-radius: 999px; border: none; cursor: pointer; z-index: 6;
        white-space: nowrap;
      }
      .boxActionBtn.editBtn { background: #378ADD; color: #fff; }
      .boxActionBtn.deleteBtn { background: #E24B4A; color: #fff; }

      #plusBtn {
        position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px;
        border-radius: 50%; background: #1D9E75; color: #fff; border: none;
        font-size: 28px; line-height: 1; cursor: pointer; z-index: 20;
        box-shadow: 0 4px 14px rgba(0,0,0,0.5); transition: transform 0.12s ease;
        display: flex; align-items: center; justify-content: center;
      }
      #plusBtn:hover { transform: scale(1.06); }

      #libraryPanel {
        position: absolute; top: 0; right: 0; bottom: 0; width: 260px;
        background: #1a1a1d; color: #eee; padding: 20px; box-sizing: border-box;
        font-family: system-ui, sans-serif; overflow-y: auto; z-index: 20;
        display: none; border-left: 1px solid #2c2c30;
      }
      #libraryPanel h3 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
      #libraryGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
      #libraryGrid button {
        font-size: 12px; padding: 8px 0; border-radius: 6px; border: 1px solid #333;
        background: #26262a; color: #eee; cursor: pointer; transition: background 0.12s ease;
      }
      #libraryGrid button:hover { background: #333338; }
      #libraryGrid button.assigned { border-color: #EF9F27; background: #3a2e1c; }

      #newChordBtn, #deleteChordBtn {
        width: 100%; margin-bottom: 8px; font-size: 12px; padding: 9px 0;
        border-radius: 6px; border: 1px solid #333; background: #26262a; color: #eee;
        cursor: pointer;
      }
      #deleteChordBtn:disabled { opacity: 0.35; cursor: not-allowed; }

      #advancedSettings { margin-top: 8px; border-top: 1px solid #2c2c30; padding-top: 12px; }
      #advancedSettings summary { font-size: 13px; cursor: pointer; color: #bbb; }
      #advancedSettings label { display: block; font-size: 12px; color: #999; margin: 10px 0 4px; }
      #colorInput { width: 100%; height: 32px; border: none; background: none; cursor: pointer; }
      #hexReadout { font-size: 11px; color: #777; margin: 4px 0 0; font-family: monospace; }
      #opacityInput { width: 100%; }

      #doneBtn {
        width: 100%; margin-top: 20px; padding: 10px 0; font-size: 13px; font-weight: 600;
        border-radius: 8px; border: none; background: #1D9E75; color: #fff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="keyboardsLayer"></div>
      <button id="plusBtn" aria-label="Add keyboard">+</button>
      <div id="libraryPanel">
        <h3>Chord library</h3>
        <div id="libraryGrid"></div>
        <button id="newChordBtn">+ New chord</button>
        <button id="deleteChordBtn">Delete chord</button>
        <details id="advancedSettings">
          <summary>Advanced settings</summary>
          <label for="colorInput">Color</label>
          <input type="color" id="colorInput" />
          <p id="hexReadout"></p>
          <label for="opacityInput">Transparency</label>
          <input type="range" id="opacityInput" min="0" max="100" />
        </details>
        <button id="doneBtn">Done</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
