<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chord tool — step 1: tracking</title>
    <style>
      html, body { margin: 0; background: #111; height: 100%; }
      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      video, canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1); /* mirror, so it feels natural */
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        background: rgba(0,0,0,0.5);
        padding: 8px 12px;
        border-radius: 8px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="status">Requesting camera…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
