<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chord tool</title>
    <style>
      html, body { margin: 0; background: #111; height: 100%; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 100vh; }
      video {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1);
      }
      #keyboardsLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      .pad {
        position: absolute; width: 56px; height: 56px; border-radius: 50%;
        background: rgba(255,255,255,0.9); border: 2px solid #333;
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, sans-serif; font-weight: 600; font-size: 14px;
        transform: translate(-50%, -50%); cursor: pointer; user-select: none;
      }
      .pad.selected { border-color: #EF9F27; border-width: 3px; }
      .pad.playing { background: #FAC775; }
      #plusBtn {
        position: absolute; right: 24px; bottom: 24px; width: 56px; height: 56px;
        border-radius: 50%; background: #fff; border: none; font-size: 28px;
        cursor: pointer; z-index: 20;
      }
      #libraryPanel {
        position: absolute; top: 0; right: 0; bottom: 0; width: 240px;
        background: #1c1c1c; color: #eee; padding: 16px; box-sizing: border-box;
        font-family: system-ui, sans-serif; overflow-y: auto; z-index: 20;
        display: none;
      }
      #libraryPanel h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
      #libraryGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
      #libraryGrid button, #newChordBtn, #deleteChordBtn, #doneBtn {
        font-size: 12px; padding: 8px 0; border-radius: 6px; border: 1px solid #444;
        background: #2a2a2a; color: #eee; cursor: pointer;
      }
      #newChordBtn, #deleteChordBtn { width: 100%; margin-bottom: 8px; }
      #deleteChordBtn:disabled { opacity: 0.4; cursor: not-allowed; }
      #doneBtn {
        position: absolute; left: 24px; bottom: 24px; width: auto; padding: 10px 20px;
        z-index: 20; display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="keyboardsLayer"></div>
      <button id="plusBtn" aria-label="Add keyboard">+</button>
      <button id="doneBtn">Done</button>
      <div id="libraryPanel">
        <h3>Chord library</h3>
        <div id="libraryGrid"></div>
        <button id="newChordBtn">+ New chord</button>
        <button id="deleteChordBtn">Delete chord</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
